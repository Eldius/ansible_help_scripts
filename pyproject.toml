[project]
name = "ansible-help-scripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "asyncssh>=2.23.0",
    "findssh>=2.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
ansible-hosts-fetch = "ansible_help_scripts.hosts_fetch:main"
ansible-generate-inventory = "ansible_help_scripts.generate_inventory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
